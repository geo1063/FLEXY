<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090b">

  <title>FLEXY</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #09090b;
      --bg-ambient-1: rgba(10, 132, 255, 0.15);
      --bg-ambient-2: rgba(191, 90, 242, 0.12);
      --card-bg: rgba(22, 22, 28, 0.95);
      --card-border: rgba(255, 255, 255, 0.1);
      --glass-panel: #121216;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #0a84ff;
      --accent-gradient: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
      --msg-out-gradient: linear-gradient(135deg, #0071e3 0%, #0a84ff 100%);
      --msg-in: rgba(255, 255, 255, 0.08);
      --msg-in-border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(255, 255, 255, 0.06);
      --input-border: rgba(255, 255, 255, 0.12);
      --shadow-glow: 0 0 35px rgba(10, 132, 255, 0.25);
    }

    body.light-theme {
      --bg: #f4f4f7;
      --bg-ambient-1: rgba(0, 122, 255, 0.12);
      --bg-ambient-2: rgba(175, 82, 222, 0.1);
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(0, 0, 0, 0.08);
      --glass-panel: #ffffff;
      --text: #09090b;
      --text-muted: #71717a;
      --accent: #007aff;
      --accent-gradient: linear-gradient(135deg, #007aff 0%, #5856d6 100%);
      --msg-out-gradient: linear-gradient(135deg, #007aff 0%, #34c759 100%);
      --msg-in: rgba(0, 0, 0, 0.05);
      --msg-in-border: rgba(0, 0, 0, 0.06);
      --input-bg: rgba(0, 0, 0, 0.04);
      --input-border: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { background-color: var(--bg); color: var(--text); height: 100%; width: 100%; overflow: hidden; position: fixed; }

    .ambient-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .ambient-glow-1 { position: absolute; top: -20%; left: -10%; width: 60vw; height: 60vw; background: var(--bg-ambient-1); filter: blur(120px); border-radius: 50%; }
    .ambient-glow-2 { position: absolute; bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: var(--bg-ambient-2); filter: blur(120px); border-radius: 50%; }

    #toast-container { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
    .toast-banner { pointer-events: auto; background: var(--glass-panel); border: 1px solid var(--card-border); color: var(--text); padding: 14px 18px; border-radius: 20px; box-shadow: 0 16px 32px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 14px; cursor: pointer; animation: toastIn 0.3s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

    .toast-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-gradient); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
    .toast-content { flex: 1; overflow: hidden; }
    .toast-title { font-size: 14px; font-weight: 700; }
    .toast-body { font-size: 13px; color: var(--text-muted); text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }

    #auth-screen { position: relative; z-index: 10; display: flex; justify-content: center; align-items: center; height: 100dvh; padding: 20px; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 40px 30px; border-radius: 32px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .brand-badge { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 20px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; color: #fff; box-shadow: var(--shadow-glow); }
    .auth-card h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .auth-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }

    .bot-link-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; background: rgba(42, 171, 238, 0.15); border: 1px solid rgba(42, 171, 238, 0.3); color: #2AABEE; text-decoration: none; border-radius: 18px; font-weight: 600; font-size: 15px; margin-bottom: 16px; }
    .auth-card input { width: 100%; padding: 16px; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text); border-radius: 18px; font-size: 24px; font-weight: 700; outline: none; margin-bottom: 16px; text-align: center; letter-spacing: 6px; }
    .submit-btn { width: 100%; padding: 16px; background: var(--accent-gradient); color: white; border: none; border-radius: 18px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: var(--shadow-glow); }

    #app-screen { display: none; width: 100%; height: 100dvh; position: relative; z-index: 10; }
    .app-container { display: flex; width: 100%; height: 100dvh; position: relative; overflow: hidden; background: var(--bg); }

    .sidebar { width: 360px; background: var(--glass-panel); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; height: 100dvh; flex-shrink: 0; z-index: 2; }
    .user-bar { padding: 18px 20px; padding-top: max(18px, env(safe-area-inset-top)); border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .user-info { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .actions-box { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--card-border); }
    .action-btn { width: 100%; padding: 12px 16px; background: var(--accent-gradient); color: white; border: none; border-radius: 14px; font-weight: 600; font-size: 13px; cursor: pointer; text-align: center; }
    .action-btn.secondary { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text); }

    .chats-list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
    .chat-item { padding: 12px 14px; border-radius: 18px; cursor: pointer; display: flex; align-items: center; gap: 14px; border: 1px solid transparent; }
    .chat-item:hover, .chat-item.active { background: var(--input-bg); border-color: var(--card-border); }
    .chat-item-avatar { width: 46px; height: 46px; border-radius: 16px; background: var(--accent-gradient); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; flex-shrink: 0; }

    .chat-window { flex: 1; display: flex; flex-direction: column; justify-content: space-between; height: 100dvh; overflow: hidden; background: var(--bg); z-index: 1; }
    .chat-header { padding: 14px 20px; padding-top: max(14px, env(safe-area-inset-top)); background: var(--glass-panel); border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn-pill { display: none; align-items: center; justify-content: center; padding: 8px 14px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 14px; color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer; }
    .header-user-meta { display: flex; align-items: center; gap: 12px; }
    .header-avatar { width: 40px; height: 40px; border-radius: 14px; background: var(--accent-gradient); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
    .header-title { font-size: 16px; font-weight: 700; }
    .header-status { font-size: 12px; color: #30d158; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .header-status::before { content: ''; width: 6px; height: 6px; background: #30d158; border-radius: 50%; display: inline-block; }

    .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
    .system-date-pill { align-self: center; background: var(--glass-panel); border: 1px solid var(--card-border); color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 6px 16px; border-radius: 20px; margin: 12px 0; }

    .message { max-width: 70%; padding: 12px 16px; border-radius: 22px; font-size: 15px; line-height: 1.45; word-break: break-word; position: relative; animation: msgPop 0.2s ease forwards; }
    @keyframes msgPop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .message.sent { background: var(--msg-out-gradient); align-self: flex-end; border-bottom-right-radius: 6px; color: #ffffff; box-shadow: 0 4px 20px rgba(10, 132, 255, 0.25); }
    .message.received { background: var(--msg-in); border: 1px solid var(--msg-in-border); align-self: flex-start; border-bottom-left-radius: 6px; color: var(--text); }
    .message img { max-width: 100%; max-height: 320px; border-radius: 16px; margin-top: 6px; display: block; }
    .message .time { font-size: 10px; opacity: 0.6; text-align: right; margin-top: 4px; font-weight: 600; }

    .input-area-wrapper { padding: 12px 20px; padding-bottom: max(16px, env(safe-area-inset-bottom)); z-index: 10; }
    .input-area { background: var(--glass-panel); border: 1px solid var(--card-border); border-radius: 26px; padding: 6px 8px 6px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .attach-btn-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--input-bg); border: 1px solid var(--input-border); display: flex; align-items: center; justify-content: center; color: var(--text); font-size: 18px; cursor: pointer; flex-shrink: 0; }
    .input-area input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 15px; font-weight: 500; }
    .send-circle-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-gradient); border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: var(--shadow-glow); }

    /* 📱 Мобильная верстка */
    @media (max-width: 768px) {
      .sidebar { width: 100%; }
      .chat-window { width: 100%; }
      .back-btn-pill { display: flex; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body>

  <div class="ambient-bg">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>
  </div>

  <div id="toast-container"></div>

  <div id="auth-screen">
    <div class="auth-card">
      <div class="brand-badge">F</div>
      <h2>FLEXY</h2>
      <p>Вход по 4-значному коду из Telegram бота</p>
      
      <a id="bot-btn" href="https://t.me/FlexyAuthBot" target="_blank" class="bot-link-btn">
        <span>🤖 Открыть Telegram бота</span>
      </a>

      <input type="number" id="code-input" placeholder="0000" autocomplete="off">
      <button class="submit-btn" onclick="verifyCode()">Войти в мессенджер</button>
    </div>
  </div>

  <div id="app-screen">
    <div class="app-container">
      
      <div class="sidebar" id="sidebar-view">
        <div class="user-bar">
          <div class="user-info">
            <span style="color: var(--accent);">●</span>
            <span id="my-name">FLEXY</span>
          </div>
          <div class="header-actions">
            <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
            <button class="icon-btn" id="notif-btn" onclick="requestNotificationPermission()">🔔</button>
            <button class="icon-btn" onclick="logout()">🚪</button>
          </div>
        </div>
        
        <div class="actions-box">
          <button class="action-btn" onclick="copyInviteLink()">🔗 Скопировать инвайт-ссылку</button>
          <button class="action-btn secondary" onclick="addFriendPrompt()">➕ Написать по @username</button>
        </div>

        <div class="chats-list" id="chats-list"></div>
      </div>

      <div class="chat-window" id="chat-view">
        <div class="chat-header">
          <div class="header-left">
            <button class="back-btn-pill" onclick="closeMobileChat()">‹ Назад</button>
            <div class="header-user-meta">
              <div class="header-avatar" id="chat-avatar">?</div>
              <div>
                <div class="header-title" id="chat-title">Чат не выбран</div>
                <div class="header-status" id="chat-status">выберите диалог</div>
              </div>
            </div>
          </div>
          <button class="icon-btn" id="clear-chat-btn" onclick="clearCurrentChat()" style="display:none;">🗑️</button>
        </div>

        <div class="messages-area" id="messages-area">
          <div class="system-date-pill">Выберите диалог слева</div>
        </div>

        <div class="input-area-wrapper" id="input-area-wrapper" style="visibility: hidden;">
          <div class="input-area">
            <label class="attach-btn-circle" title="Прикрепить фото">
              📷
              <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="sendPhoto(event)">
            </label>

            <input type="text" id="message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendTextMessage()">

            <button class="send-circle-btn" onclick="sendTextMessage()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = '', activeChatUser = null;
    let audioCtx = null;

    function unlockAudio() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('click', unlockAudio, { once: true });

    const savedTheme = localStorage.getItem('flexy_theme') || 'dark';
    applyTheme(savedTheme);

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('theme-btn').innerText = '☀️';
      } else {
        document.body.classList.remove('light-theme');
        document.getElementById('theme-btn').innerText = '🌙';
      }
    }

    function toggleTheme() {
      const current = localStorage.getItem('flexy_theme') === 'light' ? 'dark' : 'light';
      localStorage.setItem('flexy_theme', current);
      applyTheme(current);
    }

    let chatHistories = JSON.parse(localStorage.getItem('flexy_chat_histories') || '{}');
    let savedFriends = JSON.parse(localStorage.getItem('flexy_friends') || '[]');
    
    const urlParams = new URLSearchParams(window.location.search);
    const pendingInvite = urlParams.get('invite');

    // 🎯 Жесткое разделение экранов для телефонов
    function syncView() {
      const isMobile = window.innerWidth <= 768;
      const sidebar = document.getElementById('sidebar-view');
      const chat = document.getElementById('chat-view');
      
      if (isMobile) {
        if (activeChatUser) {
          sidebar.style.display = 'none';
          chat.style.display = 'flex';
        } else {
          sidebar.style.display = 'flex';
          chat.style.display = 'none';
        }
      } else {
        sidebar.style.display = 'flex';
        chat.style.display = 'flex';
      }
    }
    window.addEventListener('resize', syncView);

    socket.on('connect', () => {
      const storedUser = localStorage.getItem('flexy_username');
      if (storedUser) {
        socket.emit('auto_login', storedUser);
      }
    });

    function verifyCode() {
      unlockAudio();
      const code = document.getElementById('code-input').value.trim();
      if (!code) return alert('Введите код');
      socket.emit('verify_code', code);
    }

    socket.on('auth_error', (msg) => alert(msg));

    socket.on('registered', ({ username }) => {
      currentUser = username.toLowerCase();
      localStorage.setItem('flexy_username', currentUser);
      
      document.getElementById('my-name').innerText = `@${currentUser}`;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';

      if (pendingInvite && pendingInvite.toLowerCase() !== currentUser) {
        addFriend(pendingInvite.toLowerCase());
        openChat(pendingInvite.toLowerCase());
      } else {
        updateChatsList();
        syncView();
      }
    });

    function logout() {
      if (confirm('Выйти из аккаунта?')) {
        localStorage.removeItem('flexy_username');
        location.reload();
      }
    }

    function requestNotificationPermission() {
      unlockAudio();
      if (!('Notification' in window)) return alert('Уведомления поддерживаются при добавлении на рабочий стол.');
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') alert('Уведомления включены!');
      });
    }

    function playSound() {
      try {
        unlockAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    function showInAppToast(sender, content, type) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-banner';
      const bodyText = type === 'image' ? '📷 Фотография' : content;
      
      toast.innerHTML = `
        <div class="toast-avatar">${sender.charAt(0).toUpperCase()}</div>
        <div class="toast-content">
          <div class="toast-title">@${sender}</div>
          <div class="toast-body">${escapeHTML(bodyText)}</div>
        </div>
      `;

      toast.onclick = () => { openChat(sender); toast.remove(); };
      container.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
    }

    function triggerMessageNotification(sender, content, type) {
      playSound();
      if (activeChatUser !== sender) showInAppToast(sender, content, type);
    }

    function addFriend(username) {
      const clean = username.trim().toLowerCase().replace(/^@/, '');
      if (!clean || clean === currentUser) return;
      if (!savedFriends.includes(clean)) {
        savedFriends.push(clean);
        localStorage.setItem('flexy_friends', JSON.stringify(savedFriends));
      }
      updateChatsList();
    }

    function addFriendPrompt() {
      const target = prompt('Введите @username:');
      if (target) {
        const clean = target.trim().toLowerCase().replace(/^@/, '');
        addFriend(clean);
        openChat(clean);
      }
    }

    function copyInviteLink() {
      const link = `${window.location.origin}?invite=${currentUser}`;
      navigator.clipboard.writeText(link);
      alert('Инвайт-ссылка скопирована!');
    }

    function openChat(username) {
      unlockAudio();
      activeChatUser = username.toLowerCase();
      addFriend(activeChatUser);
      if (!chatHistories[activeChatUser]) chatHistories[activeChatUser] = [];
      
      document.getElementById('chat-title').innerText = `@${activeChatUser}`;
      document.getElementById('chat-status').innerText = `в сети`;
      document.getElementById('chat-avatar').innerText = activeChatUser.charAt(0).toUpperCase();
      document.getElementById('input-area-wrapper').style.visibility = 'visible';
      document.getElementById('clear-chat-btn').style.display = 'flex';
      
      syncView();
      updateChatsList();
      renderMessages();
    }

    function closeMobileChat() {
      activeChatUser = null;
      syncView();
    }

    function clearCurrentChat() {
      if (!activeChatUser) return;
      if (confirm(`Очистить переписку с @${activeChatUser}?`)) {
        chatHistories[activeChatUser] = [];
        localStorage.setItem('flexy_chat_histories', JSON.stringify(chatHistories));
        renderMessages();
        updateChatsList();
      }
    }

    function updateChatsList() {
      const list = document.getElementById('chats-list'); list.innerHTML = '';
      savedFriends.forEach(u => {
        const history = chatHistories[u] || [];
        const lastMsg = history.length > 0 ? history[history.length - 1] : null;
        let lastText = 'Нет сообщений';
        if (lastMsg) lastText = lastMsg.type === 'image' ? '📷 Фотография' : lastMsg.content;

        const d = document.createElement('div');
        d.className = `chat-item ${u === activeChatUser ? 'active' : ''}`;
        d.innerHTML = `
          <div class="chat-item-avatar">${u.charAt(0).toUpperCase()}</div>
          <div style="flex:1; overflow:hidden;">
            <div style="font-size:15px; font-weight:700;">@${u}</div>
            <div style="font-size:12px; color:var(--text-muted); text-overflow:ellipsis; white-space:nowrap; overflow:hidden; margin-top:2px;">${escapeHTML(lastText)}</div>
          </div>
        `;
        d.onclick = () => openChat(u);
        list.appendChild(d);
      });
    }

    function sendTextMessage() {
      unlockAudio();
      const el = document.getElementById('message-input');
      const text = el.value.trim();
      if (!text) return;
      if (!activeChatUser) return alert('Выберите чат');

      socket.emit('private_message', { to: activeChatUser, content: text, type: 'text' });
      el.value = '';
    }

    function compressAndSendPhoto(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          const maxDimension = 1280;

          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }

          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
          socket.emit('private_message', { to: activeChatUser, content: compressedBase64, type: 'image' });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function sendPhoto(e) {
      unlockAudio();
      const file = e.target.files[0];
      if (!file || !activeChatUser) return;
      compressAndSendPhoto(file);
      e.target.value = '';
    }

    socket.on('message_sent', handleIncoming);
    socket.on('receive_message', handleIncoming);

    function handleIncoming(data) {
      const partner = data.sender === currentUser ? data.to : data.sender;
      addFriend(partner);
      
      if (!chatHistories[partner]) chatHistories[partner] = [];
      chatHistories[partner].push(data);

      localStorage.setItem('flexy_chat_histories', JSON.stringify(chatHistories));

      if (data.sender !== currentUser) {
        triggerMessageNotification(data.sender, data.content, data.type);
      }

      if (activeChatUser === partner) renderMessages();
      updateChatsList();
    }

    function renderMessages() {
      const area = document.getElementById('messages-area'); area.innerHTML = '';
      if (!activeChatUser || !chatHistories[activeChatUser]) return;

      const datePill = document.createElement('div');
      datePill.className = 'system-date-pill';
      datePill.innerText = 'Зашифрованный диалог';
      area.appendChild(datePill);

      chatHistories[activeChatUser].forEach(m => {
        const d = document.createElement('div');
        d.className = `message ${m.sender === currentUser ? 'sent' : 'received'}`;
        d.innerHTML = `${m.type === 'text' ? '<div>'+escapeHTML(m.content)+'</div>' : '<img src="'+m.content+'">'}<div class="time">${m.time}</div>`;
        area.appendChild(d);
      });
      area.scrollTop = area.scrollHeight;
    }

    function escapeHTML(s) { return s.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t)); }
  </script>
</body>
</html>
