<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- PWA и Standalone режим для iOS / Android (убирает поисковую строку Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FLEXY">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  
  <!-- Встроенный Web Manifest прямо в HTML (без создания внешних файлов) -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22FLEXY%22%2C%22short_name%22%3A%22FLEXY%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">

  <title>FLEXY</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #1c1c1e;
      --panel-translucent: rgba(28, 28, 30, 0.88);
      --pill-bg: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-muted: #8e8e93;
      --accent: #0a84ff;
      --msg-out: #264970;
      --msg-in: #212123;
      --msg-in-text: #ffffff;
      --border: rgba(255, 255, 255, 0.1);
      --avatar-bg: #f2a43b;
      --auth-card-bg: #1c1c1e;
      --input-bg: rgba(255, 255, 255, 0.08);
      --sidebar-bg: #121214;
      --user-bar-bg: #18181a;
      --chat-active-bg: #1f1f22;
      --ease-ios: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    body.light-theme {
      --bg: #f2f2f7;
      --panel: #ffffff;
      --panel-translucent: rgba(255, 255, 255, 0.88);
      --pill-bg: rgba(0, 0, 0, 0.06);
      --text: #000000;
      --text-muted: #6c6c70;
      --accent: #007aff;
      --msg-out: #007aff;
      --msg-in: #e5e5ea;
      --msg-in-text: #000000;
      --border: rgba(0, 0, 0, 0.1);
      --auth-card-bg: #ffffff;
      --input-bg: rgba(0, 0, 0, 0.05);
      --sidebar-bg: #f9f9fb;
      --user-bar-bg: #ffffff;
      --chat-active-bg: #e8e8ed;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    button, .action-btn, .attach-btn-circle, .action-circle-btn, .chat-item {
      transition: transform 0.15s var(--ease-ios), opacity 0.15s ease, background-color 0.2s ease;
    }
    button:active, .action-btn:active, .attach-btn-circle:active, .action-circle-btn:active, .chat-item:active {
      transform: scale(0.92);
      opacity: 0.75;
    }

    /* Всплывающие уведомления внутри приложения (Toasts) */
    #toast-container {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
    }

    .toast-banner {
      pointer-events: auto;
      background: var(--panel-translucent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      animation: toastIn 0.3s var(--ease-ios) forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--avatar-bg); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; flex-shrink: 0;
    }

    .toast-content { flex: 1; overflow: hidden; }
    .toast-title { font-size: 14px; font-weight: 700; }
    .toast-body { font-size: 13px; color: var(--text-muted); text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }

    /* Авторизация */
    #auth-screen { 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      height: 100dvh; 
      padding: 20px; 
      background: var(--bg); 
    }
    .auth-card { 
      background: var(--auth-card-bg); 
      color: var(--text);
      padding: 32px 24px; 
      border-radius: 24px; 
      width: 100%; 
      max-width: 360px; 
      text-align: center; 
      border: 1px solid var(--border); 
      box-shadow: 0 12px 40px rgba(0,0,0,0.15); 
      animation: iosSlideUp 0.35s var(--ease-ios) forwards;
    }
    .auth-card h2 { margin-bottom: 8px; font-weight: 700; font-size: 28px; }
    .auth-card p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.4; }
    .bot-link-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; background: #2AABEE; color: white; text-decoration: none; border-radius: 14px; font-weight: 600; font-size: 15px; margin-bottom: 14px; }
    .auth-card input { width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 14px; font-size: 20px; outline: none; margin-bottom: 14px; text-align: center; letter-spacing: 4px; }
    .auth-card button { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 14px; font-weight: 600; font-size: 16px; cursor: pointer; }

    /* Приложение */
    #app-screen { display: none; width: 100%; height: 100dvh; }
    .app-container { display: flex; width: 100%; height: 100dvh; position: relative; overflow: hidden; }

    .sidebar { 
      width: 320px; 
      background: var(--sidebar-bg); 
      border-right: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      height: 100dvh;
      flex-shrink: 0;
    }
    .user-bar { 
      padding: 14px 16px; 
      padding-top: max(14px, env(safe-area-inset-top)); 
      font-weight: 700; 
      color: var(--text); 
      font-size: 18px; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: var(--user-bar-bg); 
    }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text); opacity: 0.8; }
    
    .actions-box { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
    .action-btn { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .action-btn.secondary { background: var(--pill-bg); color: var(--text); border: 1px solid var(--border); }

    .chats-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .chat-item { padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--border); font-weight: 500; display: flex; align-items: center; gap: 12px; }
    .chat-item.active { background: var(--chat-active-bg); }
    .chat-item-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--avatar-bg); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex-shrink: 0; }

    .chat-window { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      background: var(--bg); 
      position: relative; 
      height: 100dvh; 
      overflow: hidden;
    }

    .chat-header {
      padding: 10px 16px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: var(--panel-translucent);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 8px; }
    .back-btn-pill {
      display: none; align-items: center; gap: 4px;
      background: var(--pill-bg); border-radius: 20px;
      padding: 6px 12px; color: var(--text); font-size: 14px; font-weight: 600;
      border: none; cursor: pointer;
    }

    .header-center-pill {
      background: var(--pill-bg);
      border-radius: 20px;
      padding: 6px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header-title { font-size: 15px; font-weight: 700; line-height: 1.2; color: var(--text); }
    .header-status { font-size: 11px; color: var(--text-muted); font-weight: 400; }

    .header-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--avatar-bg); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px;
    }

    .messages-area {
      flex: 1 1 auto;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2;
      -webkit-overflow-scrolling: touch;
    }

    .system-date-pill {
      align-self: center;
      background: var(--pill-bg);
      color: var(--text-muted);
      font-size: 12px; font-weight: 500;
      padding: 4px 14px; border-radius: 12px;
      margin: 8px 0; text-align: center;
    }

    @keyframes msgAppear {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message {
      max-width: 78%; 
      padding: 9px 13px; 
      border-radius: 18px;
      font-size: 15px; 
      line-height: 1.35; 
      word-break: break-word; 
      position: relative;
      animation: msgAppear 0.2s var(--ease-ios) forwards;
    }
    .message.sent {
      background: var(--msg-out); 
      align-self: flex-end;
      border-bottom-right-radius: 4px; 
      color: #ffffff;
    }
    .message.received {
      background: var(--msg-in); 
      align-self: flex-start;
      border-bottom-left-radius: 4px; 
      color: var(--msg-in-text);
    }
    .message img { max-width: 100%; max-height: 280px; border-radius: 12px; margin-top: 4px; display: block; }
    .message .time { font-size: 10px; opacity: 0.6; text-align: right; margin-top: 2px; }

    .input-area {
      flex-shrink: 0;
      padding: 8px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: var(--panel-translucent);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      display: flex;
      gap: 10px;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 10;
      width: 100%;
    }

    .attach-btn-circle {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--pill-bg); display: flex;
      align-items: center; justify-content: center;
      color: var(--text); font-size: 18px; cursor: pointer; flex-shrink: 0;
    }

    .input-capsule {
      flex: 1; display: flex; align-items: center;
      background: var(--input-bg); border-radius: 22px;
      padding: 0 16px; border: 1px solid var(--border);
    }
    .input-capsule input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 16px; padding: 9px 0;
    }
    .input-capsule input::placeholder { color: var(--text-muted); }

    .action-circle-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent); border: none; color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(10, 132, 255, 0.3);
    }

    @keyframes iosSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .sidebar { width: 100%; }
      .chat-window { 
        display: none; width: 100%; position: fixed; inset: 0; z-index: 20;
      }
      .app-container.chat-active .chat-window { 
        display: flex; animation: iosSlideUp 0.25s var(--ease-ios) forwards;
      }
      .back-btn-pill { display: flex; }
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div id="auth-screen">
    <div class="auth-card">
      <h2>FLEXY</h2>
      <p>Получите 4-значный код в Telegram для входа</p>
      <a id="bot-btn" href="https://t.me/FlexyAuthBot" target="_blank" class="bot-link-btn">
        <span>🤖 Получить код в Telegram</span>
      </a>
      <input type="number" id="code-input" placeholder="0000" autocomplete="off">
      <button onclick="verifyCode()">Войти в FLEXY</button>
    </div>
  </div>

  <div id="app-screen">
    <div class="app-container" id="app-container">
      <div class="sidebar">
        <div class="user-bar">
          <span id="my-name">FLEXY</span>
          <div class="header-actions">
            <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Переключить тему">🌙</button>
            <button class="icon-btn" id="notif-btn" onclick="requestNotificationPermission()" title="Уведомления">🔔</button>
            <button class="icon-btn" onclick="logout()" title="Выйти">🚪</button>
          </div>
        </div>
        
        <div class="actions-box">
          <button class="action-btn" onclick="copyInviteLink()">🔗 Скопировать инвайт-ссылку</button>
          <button class="action-btn secondary" onclick="addFriendPrompt()">➕ Добавить друга по @username</button>
        </div>

        <div class="chats-list" id="chats-list"></div>
      </div>

      <div class="chat-window">
        <div class="chat-header">
          <div class="header-left">
            <button class="back-btn-pill" onclick="closeMobileChat()">‹ Назад</button>
          </div>
          <div class="header-center-pill">
            <span class="header-title" id="chat-title">Чат не выбран</span>
            <span class="header-status" id="chat-status">выберите собеседника</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <button class="icon-btn" id="clear-chat-btn" onclick="clearCurrentChat()" style="display:none;" title="Очистить чат">🗑️</button>
            <div class="header-avatar" id="chat-avatar">?</div>
          </div>
        </div>

        <div class="messages-area" id="messages-area">
          <div class="system-date-pill">Выберите чат слева</div>
        </div>

        <div class="input-area" id="input-area" style="visibility: hidden;">
          <label class="attach-btn-circle" title="Прикрепить фото">
            📎
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="sendPhoto(event)">
          </label>

          <div class="input-capsule">
            <input type="text" id="message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendTextMessage()">
          </div>

          <button class="action-circle-btn" onclick="sendTextMessage()" aria-label="Отправить">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = '', activeChatUser = null;
    let audioCtx = null;

    // Инициализация / Активация аудио при первом касании экрана (для iOS)
    function unlockAudio() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('click', unlockAudio, { once: true });

    const savedTheme = localStorage.getItem('flexy_theme') || 'dark';
    applyTheme(savedTheme);

    function applyTheme(theme) {
      if (theme === 'light') {
        document.body.classList.add('light-theme');
        document.getElementById('theme-btn').innerText = '☀️';
      } else {
        document.body.classList.remove('light-theme');
        document.getElementById('theme-btn').innerText = '🌙';
      }
    }

    function toggleTheme() {
      const current = localStorage.getItem('flexy_theme') === 'light' ? 'dark' : 'light';
      localStorage.setItem('flexy_theme', current);
      applyTheme(current);
    }

    let chatHistories = JSON.parse(localStorage.getItem('flexy_chat_histories') || '{}');
    let savedFriends = JSON.parse(localStorage.getItem('flexy_friends') || '[]');
    
    const urlParams = new URLSearchParams(window.location.search);
    const pendingInvite = urlParams.get('invite');

    socket.on('connect', () => {
      const storedUser = localStorage.getItem('flexy_username');
      if (storedUser) {
        socket.emit('auto_login', storedUser);
      }
    });

    function verifyCode() {
      unlockAudio();
      const code = document.getElementById('code-input').value.trim();
      if (!code) return alert('Введите код');
      socket.emit('verify_code', code);
    }

    socket.on('auth_error', (msg) => alert(msg));

    socket.on('registered', ({ username }) => {
      currentUser = username.toLowerCase();
      localStorage.setItem('flexy_username', currentUser);
      
      document.getElementById('my-name').innerText = `@${currentUser}`;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';

      checkNotificationPermission();

      if (pendingInvite && pendingInvite.toLowerCase() !== currentUser) {
        addFriend(pendingInvite.toLowerCase());
        openChat(pendingInvite.toLowerCase());
      } else {
        updateChatsList();
      }
    });

    function logout() {
      if (confirm('Выйти из аккаунта? История на устройстве сохранится.')) {
        localStorage.removeItem('flexy_username');
        location.reload();
      }
    }

    /* --- Уведомления, Вибрация и Звук --- */
    function requestNotificationPermission() {
      unlockAudio();
      if (!('Notification' in window)) {
        alert('Системные уведомления поддерживаются на iOS при добавлении на экран "Домой" (iOS 16.4+). Внутри приложения баннеры и звук уже работают!');
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          alert('Системные уведомления успешно включены!');
        } else if (permission === 'denied') {
          alert('Уведомления заблокированы в настройках браузера.');
        }
        checkNotificationPermission();
      }).catch(() => {
        alert('Уведомления доступны при добавлении сайта на экран "Домой".');
      });
    }

    function checkNotificationPermission() {
      const notifBtn = document.getElementById('notif-btn');
      if ('Notification' in window && Notification.permission === 'granted') {
        notifBtn.style.opacity = '1';
      } else {
        notifBtn.style.opacity = '0.5';
      }
    }

    function playSound() {
      try {
        unlockAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    function triggerVibration() {
      if ('vibrate' in navigator) {
        try { navigator.vibrate([100, 50, 100]); } catch (e) {}
      }
    }

    function showInAppToast(sender, content, type) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-banner';
      
      const bodyText = type === 'image' ? '📷 Фотография' : content;
      
      toast.innerHTML = `
        <div class="toast-avatar">${sender.charAt(0).toUpperCase()}</div>
        <div class="toast-content">
          <div class="toast-title">@${sender}</div>
          <div class="toast-body">${escapeHTML(bodyText)}</div>
        </div>
      `;

      toast.onclick = () => {
        openChat(sender);
        toast.remove();
      };

      container.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
    }

    function triggerMessageNotification(sender, content, type) {
      playSound();
      triggerVibration();

      if (activeChatUser !== sender) {
        showInAppToast(sender, content, type);
      }

      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
        try {
          const notif = new Notification(`@${sender}`, {
            body: type === 'image' ? '📷 Фотография' : content,
            tag: sender,
            renotify: true
          });

          notif.onclick = function() {
            window.focus();
            openChat(sender);
            notif.close();
          };
        } catch(e) {}
      }
    }

    /* --- Чат и Друзья --- */
    function addFriend(username) {
      const clean = username.trim().toLowerCase().replace(/^@/, '');
      if (!clean || clean === currentUser) return;
      if (!savedFriends.includes(clean)) {
        savedFriends.push(clean);
        localStorage.setItem('flexy_friends', JSON.stringify(savedFriends));
      }
      updateChatsList();
    }

    function addFriendPrompt() {
      const target = prompt('Введите @username друга:');
      if (target) {
        const clean = target.trim().toLowerCase().replace(/^@/, '');
        addFriend(clean);
        openChat(clean);
      }
    }

    function copyInviteLink() {
      const link = `${window.location.origin}?invite=${currentUser}`;
      navigator.clipboard.writeText(link);
      alert('Инвайт-ссылка скопирована!');
    }

    function openChat(username) {
      unlockAudio();
      activeChatUser = username.toLowerCase();
      addFriend(activeChatUser);
      if (!chatHistories[activeChatUser]) chatHistories[activeChatUser] = [];
      
      document.getElementById('chat-title').innerText = `@${activeChatUser}`;
      document.getElementById('chat-status').innerText = `в сети`;
      document.getElementById('chat-avatar').innerText = activeChatUser.charAt(0).toUpperCase();
      document.getElementById('input-area').style.visibility = 'visible';
      document.getElementById('clear-chat-btn').style.display = 'block';
      document.getElementById('app-container').classList.add('chat-active');
      
      updateChatsList();
      renderMessages();
    }

    function closeMobileChat() {
      document.getElementById('app-container').classList.remove('chat-active');
    }

    function clearCurrentChat() {
      if (!activeChatUser) return;
      if (confirm(`Удалить историю диалога с @${activeChatUser}?`)) {
        chatHistories[activeChatUser] = [];
        localStorage.setItem('flexy_chat_histories', JSON.stringify(chatHistories));
        renderMessages();
        updateChatsList();
      }
    }

    function updateChatsList() {
      const list = document.getElementById('chats-list'); list.innerHTML = '';
      savedFriends.forEach(u => {
        const history = chatHistories[u] || [];
        const lastMsg = history.length > 0 ? history[history.length - 1] : null;
        let lastText = 'Нет сообщений';
        if (lastMsg) {
          lastText = lastMsg.type === 'image' ? '📷 Фотография' : lastMsg.content;
        }

        const d = document.createElement('div');
        d.className = `chat-item ${u === activeChatUser ? 'active' : ''}`;
        d.innerHTML = `
          <div class="chat-item-avatar">${u.charAt(0).toUpperCase()}</div>
          <div style="flex:1; overflow:hidden;">
            <div style="font-size:15px; font-weight:600;">@${u}</div>
            <div style="font-size:12px; color:var(--text-muted); text-overflow:ellipsis; white-space:nowrap; overflow:hidden;">${escapeHTML(lastText)}</div>
          </div>
        `;
        d.onclick = () => openChat(u);
        list.appendChild(d);
      });
    }

    function sendTextMessage() {
      unlockAudio();
      const el = document.getElementById('message-input');
      const text = el.value.trim();
      if (!text) return;
      if (!activeChatUser) return alert('Выберите чат');

      socket.emit('private_message', { to: activeChatUser, content: text, type: 'text' });
      el.value = '';
    }

    function sendPhoto(e) {
      unlockAudio();
      const file = e.target.files[0];
      if (!file || !activeChatUser) return;
      const r = new FileReader();
      r.onload = (evt) => {
        socket.emit('private_message', { to: activeChatUser, content: evt.target.result, type: 'image' });
        e.target.value = '';
      };
      r.readAsDataURL(file);
    }

    socket.on('message_sent', handleIncoming);
    socket.on('receive_message', handleIncoming);

    function handleIncoming(data) {
      const partner = data.sender === currentUser ? data.to : data.sender;
      addFriend(partner);
      
      if (!chatHistories[partner]) chatHistories[partner] = [];
      chatHistories[partner].push(data);

      localStorage.setItem('flexy_chat_histories', JSON.stringify(chatHistories));

      if (data.sender !== currentUser) {
        triggerMessageNotification(data.sender, data.content, data.type);
      }

      if (activeChatUser === partner) renderMessages();
      updateChatsList();
    }

    function renderMessages() {
      const area = document.getElementById('messages-area'); area.innerHTML = '';
      if (!activeChatUser || !chatHistories[activeChatUser]) return;

      const datePill = document.createElement('div');
      datePill.className = 'system-date-pill';
      datePill.innerText = 'История диалога';
      area.appendChild(datePill);

      chatHistories[activeChatUser].forEach(m => {
        const d = document.createElement('div');
        d.className = `message ${m.sender === currentUser ? 'sent' : 'received'}`;
        d.innerHTML = `${m.type === 'text' ? '<div>'+escapeHTML(m.content)+'</div>' : '<img src="'+m.content+'">'}<div class="time">${m.time}</div>`;
        area.appendChild(d);
      });
      area.scrollTop = area.scrollHeight;
    }

    function escapeHTML(s) { return s.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t)); }
  </script>
</body>
</html>
