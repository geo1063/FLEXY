<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FLEXY</title>
  <style>
    :root {
      --bg: #ffffff; --panel: #f4f4f5; --text: #000000; --text-muted: #707579;
      --accent: #007aff; --msg-out: #e3f2fd; --msg-in: #f0f0f0; --border: #e5e5ea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1621; --panel: #17212b; --text: #f5f5f5; --text-muted: #7f91a4;
        --accent: #5288c1; --msg-out: #2b5278; --msg-in: #182533; --border: #101921;
      }
    }

    body.theme-dark {
      --bg: #0e1621; --panel: #17212b; --text: #f5f5f5; --text-muted: #7f91a4;
      --accent: #5288c1; --msg-out: #2b5278; --msg-in: #182533; --border: #101921;
    }
    body.theme-light {
      --bg: #ffffff; --panel: #f4f4f5; --text: #000000; --text-muted: #707579;
      --accent: #007aff; --msg-out: #e3f2fd; --msg-in: #f0f0f0; --border: #e5e5ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; height: -webkit-fill-available; overflow: hidden; display: flex; justify-content: center; }

    #auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; padding: 20px; }
    .auth-card { background: var(--panel); padding: 30px; border-radius: 20px; width: 100%; max-width: 360px; text-align: center; border: 1px solid var(--border); }
    .auth-card h2 { margin-bottom: 6px; font-weight: 700; font-size: 26px; }
    .auth-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
    .bot-link-btn { display: block; width: 100%; padding: 14px; background: #2AABEE; color: white; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 15px; margin-bottom: 14px; }
    .auth-card input { width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 12px; font-size: 18px; outline: none; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
    .auth-card button { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; }

    #app-screen { display: none; width: 100%; height: 100vh; height: -webkit-fill-available; }
    .app-container { display: flex; width: 100%; height: 100%; }

    .sidebar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .user-bar { padding: 16px; font-weight: 700; color: var(--accent); font-size: 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .theme-toggle-btn { background: none; border: none; font-size: 18px; cursor: pointer; }
    
    .invite-box { padding: 14px; }
    .invite-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }

    .chats-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 16px; cursor: pointer; border-bottom: 1px solid var(--border); font-weight: 500; }
    .chat-item.active { background: var(--bg); }

    .chat-window { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
    .chat-header { padding: 14px 20px; background: var(--panel); font-weight: 600; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
    .back-btn { display: none; background: none; border: none; color: var(--accent); font-size: 16px; padding-right: 12px; }
    
    .messages-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-break: break-word; }
    .message.sent { background: var(--msg-out); align-self: flex-end; border-bottom-right-radius: 4px; }
    .message.received { background: var(--msg-in); align-self: flex-start; border-bottom-left-radius: 4px; }
    .message img { max-width: 100%; max-height: 280px; border-radius: 12px; margin-top: 4px; display: block; }
    .message .time { font-size: 10px; color: var(--text-muted); text-align: right; margin-top: 2px; }

    .input-area { padding: 10px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: var(--panel); display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--border); }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 20px; font-size: 16px; outline: none; }
    .attach-btn { color: var(--accent); font-size: 22px; cursor: pointer; }
    .send-btn { background: none; border: none; color: var(--accent); font-weight: 600; font-size: 16px; cursor: pointer; }

    @media (max-width: 768px) {
      .sidebar { width: 100%; }
      .chat-window { display: none; width: 100%; }
      .app-container.chat-active .sidebar { display: none; }
      .app-container.chat-active .chat-window { display: flex; }
      .back-btn { display: block; }
    }
  </style>
</head>
<body>

  <!-- Авторизация -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>FLEXY</h2>
      <p>Нажмите кнопку ниже, чтобы получить код в Telegram</p>
      
      <a id="bot-btn" href="https://t.me/FlexyAuthBot" target="_blank" class="bot-link-btn">1. Получить код в Telegram 🤖</a>

      <input type="number" id="code-input" placeholder="Введите код" autocomplete="off">
      <button onclick="verifyCode()">Войти в FLEXY</button>
    </div>
  </div>

  <!-- Главный экран -->
  <div id="app-screen">
    <div class="app-container" id="app-container">
      <div class="sidebar">
        <div class="user-bar">
          <span>FLEXY</span>
          <button class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
        </div>
        <div class="invite-box">
          <button class="invite-btn" onclick="copyInviteLink()">🔗 Скопировать ссылку-инвайт</button>
        </div>
        <div class="chats-list" id="chats-list"></div>
      </div>

      <div class="chat-window">
        <div class="chat-header">
          <button class="back-btn" onclick="closeMobileChat()">‹ Назад</button>
          <span id="chat-title">Выберите чат</span>
        </div>
        <div class="messages-area" id="messages-area"></div>
        <div class="input-area" id="input-area" style="visibility: hidden;">
          <label class="attach-btn">📷<input type="file" id="file-input" accept="image/*" style="display:none;" onchange="sendPhoto(event)"></label>
          <input type="text" id="message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendTextMessage()">
          <button class="send-btn" onclick="sendTextMessage()">Отправ.</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = '', activeChatUser = null;
    const chatHistories = {};

    const urlParams = new URLSearchParams(window.location.search);
    const pendingInvite = urlParams.get('invite');

    function verifyCode() {
      const code = document.getElementById('code-input').value.trim();
      if (!code) return alert('Введите 4-значный код');
      socket.emit('verify_code', code);
    }

    socket.on('auth_error', (msg) => alert(msg));

    socket.on('registered', ({ username }) => {
      currentUser = username;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';

      if (pendingInvite && pendingInvite.toLowerCase() !== currentUser.toLowerCase()) {
        openChat(pendingInvite.toLowerCase());
      }
    });

    function copyInviteLink() {
      const link = `${window.location.origin}?invite=${currentUser}`;
      navigator.clipboard.writeText(link);
      alert('Инвайт-ссылка скопирована!');
    }

    function openChat(username) {
      activeChatUser = username;
      if (!chatHistories[username]) chatHistories[username] = [];
      document.getElementById('chat-title').innerText = `@${username}`;
      document.getElementById('input-area').style.visibility = 'visible';
      document.getElementById('app-container').classList.add('chat-active');
      updateChatsList();
      renderMessages();
    }

    function closeMobileChat() {
      document.getElementById('app-container').classList.remove('chat-active');
    }

    function updateChatsList() {
      const list = document.getElementById('chats-list'); list.innerHTML = '';
      Object.keys(chatHistories).forEach(u => {
        const d = document.createElement('div');
        d.className = `chat-item ${u === activeChatUser ? 'active' : ''}`;
        d.innerText = `@${u}`;
        d.onclick = () => openChat(u);
        list.appendChild(d);
      });
    }

    function sendTextMessage() {
      const el = document.getElementById('message-input');
      if (el.value.trim() && activeChatUser) {
        socket.emit('private_message', { to: activeChatUser, content: el.value.trim(), type: 'text' });
        el.value = '';
      }
    }

    function sendPhoto(e) {
      const file = e.target.files[0];
      if (!file || !activeChatUser) return;
      const r = new FileReader();
      r.onload = (evt) => {
        socket.emit('private_message', { to: activeChatUser, content: evt.target.result, type: 'image' });
        e.target.value = '';
      };
      r.readAsDataURL(file);
    }

    socket.on('message_sent', handleIncoming);
    socket.on('receive_message', handleIncoming);

    function handleIncoming(data) {
      const partner = data.sender === currentUser ? data.to : data.sender;
      if (!chatHistories[partner]) chatHistories[partner] = [];
      chatHistories[partner].push(data);
      if (activeChatUser === partner) renderMessages();
      updateChatsList();
    }

    function renderMessages() {
      const area = document.getElementById('messages-area'); area.innerHTML = '';
      if (!activeChatUser || !chatHistories[activeChatUser]) return;
      chatHistories[activeChatUser].forEach(m => {
        const d = document.createElement('div');
        d.className = `message ${m.sender === currentUser ? 'sent' : 'received'}`;
        d.innerHTML = `${m.type === 'text' ? '<div>'+escapeHTML(m.content)+'</div>' : '<img src="'+m.content+'">'}<div class="time">${m.time}</div>`;
        area.appendChild(d);
      });
      area.scrollTop = area.scrollHeight;
    }

    function toggleTheme() {
      document.body.classList.toggle('theme-dark');
      document.body.classList.toggle('theme-light');
    }

    function escapeHTML(s) { return s.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]||t)); }
  </script>
</body>
</html>
